# Documentation build, CycloneDX SBOM and check that the documented commands run.
# Separate from ci.yml, which keeps running the tests and the CPU smoke path.
name: docs-sbom

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Build docs
        run: mkdocs build --strict

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies into a clean venv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sbom-env"
          "$RUNNER_TEMP/sbom-env/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/sbom-env/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^torch([[:space:]]|$)' uv/requirements.txt > "$RUNNER_TEMP/uv-requirements-no-torch.txt"
          "$RUNNER_TEMP/sbom-env/bin/pip" install -r "$RUNNER_TEMP/uv-requirements-no-torch.txt"
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/pip" install cyclonedx-bom==8.0.1
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment \
            --of JSON --sv 1.6 -o sbom.cdx.json "$RUNNER_TEMP/sbom-env"
          python -c "import json; d=json.load(open('sbom.cdx.json')); print(d['bomFormat'], d['specVersion'], len(d['components']), 'components')"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  readme-commands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Same cache key as ci.yml. The UV-Vis source CSV is no longer reachable
      # at its pinned GitHub mirror, so the smoke run depends on this cache.
      - name: Restore source CSVs for the smoke run
        uses: actions/cache@v6
        with:
          path: .ci-cache
          key: smoke-source-csvs-uvvis-rev02-zinc250k
      - name: Run the commands marked for CI in README and docs
        run: python tools/run_readme_blocks.py README.md docs/install.md docs/reproduce.md

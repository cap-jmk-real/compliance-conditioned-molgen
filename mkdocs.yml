site_name: compliance-conditioned-molgen
site_description: Coverage of EU chemical inventory lists and UV-Vis steered molecular generation
repo_url: https://github.com/cap-jmk-real/compliance-conditioned-molgen
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: false
            docstring_style: google
            show_root_heading: true
nav:
  - Home: index.md
  - Install: install.md
  - Repository layout: layout.md
  - Reproduce the results: reproduce.md
  - API reference: api.md
  - Data and licence: data-and-licence.md
